<html>
  <head>
    <title>BUAP DELFÍN - MAPA DEL ÍNDICE DE VIOLENCIA</title>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.3/leaflet.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.3/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>
    <script src="https://unpkg.com/htmx.org/dist/htmx.js"></script>
    <link href="assets/styles.css" rel="stylesheet" />
    <link rel="icon" href="assets/buap.ico" type="image/vnd.microsoft.icon" />
  </head>

  <body>
    <nav>
      <a href="">Inicio</a>
      <a href="map.html">Mapa de los resultados</a>
      <a href="data.html">Resultados</a>
      <a href="credits.html">Créditos</a>
    </nav>
    <h1>Mapa de Indice de Violencia</h1>
    <main class="results">
      <div id="map"></div>

      <form>
        <h2 id="loading-notification">Cargando datos...</h2>
        <label for="year">Año: <span id="year-display">2015</span> </label
        ><br />
        <input
          id="year"
          name="year"
          type="range"
          min="2015"
          max="2029"
          value="2015"
          step="1"
          hx-post="/update-year"
          hx-trigger="change, input"
          hx-swap="none"
        />
        <br />
        <label for="month">Mes:<span id="month-display">1</span> </label><br />
        <input
          id="month"
          name="month"
          type="range"
          min="1"
          max="12"
          value="1"
          step="1"
          hx-post="/update-month"
          hx-trigger="change, input"
          hx-swap="none"
        />

        <div id="prediction-message" style="display: none">
          <span><strong>Nota:</strong> Estas viendo predicciones</span>
        </div>
      </form>

      <script>
        function checkPredictionStatus() {
          const year = parseInt(document.getElementById("year").value);
          const month = parseInt(document.getElementById("month").value);
          const message = document.getElementById("prediction-message");

          if (year > 2025 || (year === 2025 && month > 3)) {
            message.style.display = "block";
          } else {
            message.style.display = "none";
          }
        }

        document
          .getElementById("year")
          .addEventListener("input", checkPredictionStatus);
        document
          .getElementById("month")
          .addEventListener("input", checkPredictionStatus);

        document.addEventListener("DOMContentLoaded", checkPredictionStatus);
      </script>

      <script src="assets/map.js"></script>
    </main>
  </body>
</html>
